name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ResourceCalculator.slnx

      - name: Build
        run: dotnet build ResourceCalculator.slnx -c Release

      - name: Test
        run: dotnet test ResourceCalculator.slnx -c Release --no-build

      - name: Publish exe
        run: dotnet publish ResourceCalculator/ResourceCalculator.csproj -c Release -p:SkipCodeSigning=true --output publish

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: publish/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" artifacts/* --title "$TAG" --generate-notes
