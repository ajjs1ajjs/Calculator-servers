name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows x64
            runner: windows-latest
            arch: x64
            rid: win-x64
            artifact_name: calculator-windows-x64
            dotnet_build: dotnet build ResourceCalculator.slnx -c Release
            dotnet_test: dotnet test ResourceCalculator.slnx -c Release --no-build
            needs_restore: ResourceCalculator.slnx
            output_dir: win-x64
          - os: Ubuntu x64
            runner: ubuntu-latest
            arch: x64
            rid: linux-x64
            artifact_name: calculator-ubuntu-x64
            dotnet_build: dotnet build ResourceCalculator.Avalonia/ResourceCalculator.Avalonia.csproj -c Release
            dotnet_test: dotnet test ResourceCalculator.Tests/ResourceCalculator.Tests.csproj -c Release
            needs_restore: ResourceCalculator.Avalonia/ResourceCalculator.Avalonia.csproj
            output_dir: linux-x64
          - os: macOS arm64
            runner: macos-14
            arch: arm64
            rid: osx-arm64
            artifact_name: calculator-macos-arm64
            dotnet_build: dotnet build ResourceCalculator.Avalonia/ResourceCalculator.Avalonia.csproj -c Release
            dotnet_test: dotnet test ResourceCalculator.Tests/ResourceCalculator.Tests.csproj -c Release
            needs_restore: ResourceCalculator.Avalonia/ResourceCalculator.Avalonia.csproj
            output_dir: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.needs_restore }}

      - name: Build
        run: ${{ matrix.dotnet_build }}

      - name: Test
        run: ${{ matrix.dotnet_test }}

      - name: Publish Avalonia (${{ matrix.os }})
        run: dotnet publish ResourceCalculator.Avalonia/ResourceCalculator.Avalonia.csproj --configuration Release -r ${{ matrix.rid }} --self-contained true --output "publish/${{ matrix.output_dir }}"

      - name: Upload artifact (${{ matrix.os }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: publish/${{ matrix.output_dir }}
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: calculator-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
