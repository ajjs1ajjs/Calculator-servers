name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ResourceCalculator.slnx

      - name: Build
        run: dotnet build ResourceCalculator.slnx -c Release

      - name: Test
        run: dotnet test ResourceCalculator.slnx -c Release --no-build

      - name: Publish portable exe (single-file, self-contained)
        run: dotnet publish ResourceCalculator/ResourceCalculator.csproj -c Release -p:SkipCodeSigning=true --output publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: publish/ITE.ResourceCalculator.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify git repo
        run: |
          echo "Current dir: $(pwd)"
          ls -la
          git status
          git log --oneline -5
          git rev-parse HEAD

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify artifact
        run: |
          echo "Artifacts dir: $(pwd)/artifacts"
          ls -la artifacts/

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Creating release for tag: $TAG"
          echo "Working dir: $(pwd)"
          git status
          gh release create "$TAG" --title "$TAG" --generate-notes

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Uploading to release: $TAG"
          gh release upload "$TAG" artifacts/release/ITE.ResourceCalculator.exe --clobber