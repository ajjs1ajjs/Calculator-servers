name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Аварійний ручний запуск. Потрібен, бо GitHub пропускає workflow для ЛЮБОЇ
  # push-події, якщо в повідомленні головного коміта є [skip ci] — включно з
  # пушем тега. Якщо тег ліг на такий коміт, реліз не збереться сам: запускаємо
  # звідси, обравши потрібний тег у полі нижче.
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релізу (напр. v2.5.0). Порожньо = поточний ref."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # provenance-атестація артефакта

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        # Версія SDK — з global.json (єдине джерело), без дублювання у workflow.

      - name: Restore
        run: dotnet restore ResourceCalculator.slnx --locked-mode

      - name: Build
        run: dotnet build ResourceCalculator.slnx -c Release

      - name: Test
        run: dotnet test ResourceCalculator.slnx -c Release --no-build

      - name: Publish Windows (win-x64, single-file, self-contained)
        run: dotnet publish ResourceCalculator/ResourceCalculator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win

      # Підпис ОБОВ'ЯЗКОВО до підрахунку контрольної суми й атестації: signtool
      # змінює файл, тож хеш непідписаного exe не збігся б з опублікованим ассетом.
      - name: Sign Windows exe (Authenticode)
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          # Fail closed: без підпису застосунок відмовиться встановлювати оновлення,
          # тож непідписаний реліз гірший за відсутність релізу — краще впасти тут.
          if (-not $env:SIGNING_PFX_BASE64) {
            Write-Host "::error::Немає секрету SIGNING_PFX_BASE64 — підписати нічим. Застосунок відкине непідписане оновлення, тож реліз зупинено."
            exit 1
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          try {
            # Windows SDK на образі windows-2025 присутній (10.0.26100.0), але
            # signtool не гарантовано в PATH — шукаємо у Windows Kits, потім у PATH.
            $signtoolPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtoolPath) { $signtoolPath = (Get-Command signtool -ErrorAction SilentlyContinue).Source }
            if (-not $signtoolPath) {
              Write-Host "::error::signtool.exe не знайдено ні у Windows Kits, ні в PATH — підписати нічим"
              exit 1
            }
            Write-Host "signtool: $signtoolPath"
            # Таймстемп обов'язковий: без нього підпис стає невалідним у день,
            # коли протермінується сертифікат, і оновлення розвалюються самі.
            & $signtoolPath sign /f $pfx /p $env:SIGNING_PFX_PASSWORD `
              /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 `
              "publish/win/ITE.ResourceCalculator.exe"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::signtool sign завершився з кодом $LASTEXITCODE"
              exit 1
            }
          }
          finally {
            if (Test-Path $pfx) { Remove-Item $pfx -Force }
          }

      # Перевіряємо підпис ТИМ САМИМ кодом, яким його перевіряє застосунок
      # (SelfUpdateService.VerifyAuthenticode: пін відбитка + WinVerifyTrust).
      # Ловить найгірший сценарій: пін у коді розійшовся з сертифікатом у секретах —
      # реліз зібрався б, але жоден користувач не зміг би оновитися.
      - name: Verify signature with the app's own check
        shell: pwsh
        env:
          ITE_SIGNED_EXE: ${{ github.workspace }}\publish\win\ITE.ResourceCalculator.exe
        run: |
          dotnet test ResourceCalculator.Tests/ResourceCalculator.Tests.csproj -c Release --no-build `
            --filter "FullyQualifiedName~UpdateSignatureTests"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Підписаний exe не проходить перевірку застосунку — оновлення були б непрацездатні"
            exit 1
          }

      - name: Checksums (SHA-256)
        shell: pwsh
        run: |
          $exe = "publish/win/ITE.ResourceCalculator.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ITE.ResourceCalculator.exe" | Out-File "publish/win/SHA256SUMS.txt" -Encoding ascii -NoNewline
          Get-Content "publish/win/SHA256SUMS.txt"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "publish/win/ITE.ResourceCalculator.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            publish/win/ITE.ResourceCalculator.exe
            publish/win/SHA256SUMS.txt

  release:
    name: Create GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write # provenance-атестація
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup git for gh CLI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status
          git log --oneline -1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Verify artifacts
        run: |
          echo "Artifacts dir: $(pwd)/artifacts"
          ls -la artifacts/ || true
          ls -la artifacts/windows-release/ || true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "Creating release for tag: $TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes --repo ${{ github.repository }}

      - name: Upload Windows to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "Uploading Windows binary to release: $TAG"
          gh release upload "$TAG" artifacts/windows-release/ITE.ResourceCalculator.exe artifacts/windows-release/SHA256SUMS.txt --clobber --repo ${{ github.repository }}
