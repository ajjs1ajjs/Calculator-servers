name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows x64
            runner: windows-latest
            arch: x64
            rid: win-x64
            artifact_name: calculator-windows-x64
            dotnet_build: dotnet build ResourceCalculator.slnx -c Release
            dotnet_test: dotnet test ResourceCalculator.slnx -c Release --no-build
            needs_restore: ResourceCalculator.slnx
            output_dir: win-x64
          - os: Ubuntu x64
            runner: ubuntu-latest
            arch: x64
            rid: linux-x64
            artifact_name: calculator-ubuntu-x64
            dotnet_build: dotnet build ResourceCalculator.Avalonia/ResourceCalculator.Avalonia.csproj -c Release
            dotnet_test: dotnet test ResourceCalculator.Tests/ResourceCalculator.Tests.csproj -c Release
            needs_restore: ResourceCalculator.Avalonia/ResourceCalculator.Avalonia.csproj
            output_dir: linux-x64
          - os: macOS arm64
            runner: macos-14
            arch: arm64
            rid: osx-arm64
            artifact_name: calculator-macos-arm64
            dotnet_build: dotnet build ResourceCalculator.Avalonia/ResourceCalculator.Avalonia.csproj -c Release
            dotnet_test: dotnet test ResourceCalculator.Tests/ResourceCalculator.Tests.csproj -c Release
            needs_restore: ResourceCalculator.Avalonia/ResourceCalculator.Avalonia.csproj
            output_dir: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.needs_restore }}

      - name: Build
        run: ${{ matrix.dotnet_build }}

      - name: Test
        run: ${{ matrix.dotnet_test }}

      - name: Publish Avalonia (${{ matrix.os }})
        run: dotnet publish ResourceCalculator.Avalonia/ResourceCalculator.Avalonia.csproj --configuration Release -r ${{ matrix.rid }} --self-contained true --output "publish/${{ matrix.output_dir }}"

      - name: Package (Windows)
        if: matrix.os == 'Windows x64'
        shell: pwsh
        run: |
          $artifact = "${{ matrix.artifact_name }}"
          $srcDir = "publish/${{ matrix.output_dir }}"
          $dstZip = "release/$artifact.zip"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path "$srcDir/*" -DestinationPath $dstZip -Force
          $hash = (Get-FileHash $dstZip -Algorithm SHA256).Hash
          "$hash  $artifact.zip" | Out-File -Encoding ASCII "release/$artifact.zip.sha256"
          Get-ChildItem release/

      - name: Package (Linux/macOS)
        if: matrix.os != 'Windows x64'
        shell: bash
        run: |
          ARTIFACT="${{ matrix.artifact_name }}"
          mkdir -p release
          cd "publish/${{ matrix.output_dir }}"
          tar -czf ../../release/$ARTIFACT.tar.gz .
          if [[ "${{ matrix.os }}" == "macOS arm64" ]]; then
            shasum -a 256 $ARTIFACT.tar.gz > ../../release/$ARTIFACT.tar.gz.sha256
          else
            sha256sum $ARTIFACT.tar.gz > ../../release/$ARTIFACT.tar.gz.sha256
          fi
          echo "=== Artifact created ==="
          ls -la ../../release/

      - name: Upload artifact (${{ matrix.os }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*${{ matrix.artifact_name }}*
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: calculator-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
