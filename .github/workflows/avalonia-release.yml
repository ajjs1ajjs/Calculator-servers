name: Avalonia Release

# Збірка застосунку (Windows) — артефакти прив'язуються до GitHub-релізу того ж тега.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish (for example v2.3.1)'
        required: true
        default: 'v2.3.1'

jobs:
  publish-windows:
    name: Publish Windows distributions
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish WPF portable executable
      shell: pwsh
      run: |
        dotnet publish ResourceCalculator/ResourceCalculator.csproj --configuration Release --output publish/wpf -p:SkipCodeSigning=true
        if (-not (Test-Path publish/wpf/ITE.ResourceCalculator.exe)) { throw 'WPF executable was not produced' }
        Copy-Item publish/wpf/ITE.ResourceCalculator.exe publish/ITE.ResourceCalculator.exe

    - name: Build MSI installer
      shell: pwsh
      run: |
        $version = '${{ inputs.release_tag || github.ref_name }}'.TrimStart('v')
        dotnet build ResourceCalculator.Installer/ResourceCalculator.Installer.wixproj --configuration Release --output publish/installer -p:Platform=x64 -p:AppVersion=$version -p:AppPublishDir="$PWD/publish/wpf/" -p:AppIconPath="$PWD/ResourceCalculator/icon.ico"
        $msi = Get-ChildItem publish/installer -Filter '*.msi' -Recurse | Select-Object -First 1
        if (-not $msi) { throw 'MSI installer was not produced' }
        Copy-Item $msi.FullName publish/ITE.ResourceCalculator.msi

    - name: Publish Avalonia Windows archive
      shell: pwsh
      run: |
        dotnet publish ResourceCalculator.Avalonia/ResourceCalculator.Avalonia.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish/avalonia-win
        Compress-Archive -Path publish/avalonia-win/* -DestinationPath publish/ITE.ResourceCalculator-avalonia-win-x64.zip -Force

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ITE.ResourceCalculator-windows
        path: |
          publish/ITE.ResourceCalculator.exe
          publish/ITE.ResourceCalculator.msi
          publish/ITE.ResourceCalculator-avalonia-win-x64.zip
        if-no-files-found: error
  attach-release:
    name: Attach to GitHub Release
    needs: [publish-windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Attach to release
      uses: softprops/action-gh-release@v2
      with:
        repository: ajjs1ajjs/Calculator-servers
        token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        target_commitish: master
        tag_name: ${{ inputs.release_tag || github.ref_name }}
        files: artifacts/**
