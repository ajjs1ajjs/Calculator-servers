name: Avalonia Release

# Кроссплатформенні збірки Avalonia-застосунку (Linux/macOS) — артефакти прив'язуються
# до GitHub-релізу того ж тега (Windows-версію збирає і заливає release.ps1: exe+MSI).
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  publish:
    name: Publish (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish (self-contained, single-file)
      run: |
        dotnet publish ResourceCalculator.Avalonia/ResourceCalculator.Avalonia.csproj \
          --configuration Release \
          --runtime ${{ matrix.rid }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          --output publish

    - name: Package
      shell: bash
      run: |
        cd publish
        if [ "${{ matrix.rid }}" = "linux-x64" ] || [ "${{ matrix.rid }}" = "osx-x64" ] || [ "${{ matrix.rid }}" = "osx-arm64" ]; then
          tar -czf ../ITE.ResourceCalculator-${{ matrix.rid }}.tar.gz *
        else
          7z a ../ITE.ResourceCalculator-${{ matrix.rid }}.zip *
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ITE.ResourceCalculator-${{ matrix.rid }}
        path: ITE.ResourceCalculator-${{ matrix.rid }}.*
        if-no-files-found: error

  attach-release:
    name: Attach to GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          repository: ajjs1ajjs/Calculator-servers
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          files: artifacts/**
