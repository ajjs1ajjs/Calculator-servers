name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test with coverage
      run: dotnet test --no-restore --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory coverage

    - name: Install coverage tool
      run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.4.5

    - name: Generate coverage report
      run: reportgenerator -reports:coverage/**/coverage.cobertura.xml -targetdir:coverage/report -reporttypes:Html

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/report

    - name: Publish (self-contained)
      run: dotnet publish ResourceCalculator/ResourceCalculator.csproj --configuration Release --output publish

    - name: Publish Avalonia (win-x64, cross-platform alternative)
      run: dotnet publish ResourceCalculator.Avalonia/ResourceCalculator.Avalonia.csproj --configuration Release -r win-x64 --output publish/avalonia-win-x64

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-publish
        path: |
          publish/ITE.ResourceCalculator.exe
          publish/avalonia-win-x64/

  build-avalonia:
    strategy:
      matrix:
        include:
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build Avalonia (cross-platform)
      run: dotnet build ResourceCalculator.Avalonia/ResourceCalculator.Avalonia.csproj --configuration Release

    - name: Test Core on ${{ matrix.os }} / ${{ matrix.rid }}
      run: dotnet test ResourceCalculator.Tests/ResourceCalculator.Tests.csproj --no-restore --configuration Release

    - name: Publish Avalonia (${{ matrix.rid }})
      run: dotnet publish ResourceCalculator.Avalonia/ResourceCalculator.Avalonia.csproj --configuration Release -r ${{ matrix.rid }} --output publish/${{ matrix.rid }}

    - name: Verify publish output
      shell: bash
      run: |
        ls -lh publish/${{ matrix.rid }}/
        test -f publish/${{ matrix.rid }}/ITE.ResourceCalculator || test -f publish/${{ matrix.rid }}/ITE.ResourceCalculator.exe

    - name: Upload Avalonia artifact (${{ matrix.rid }})
      uses: actions/upload-artifact@v4
      with:
        name: avalonia-${{ matrix.rid }}
        path: publish/${{ matrix.rid }}/
