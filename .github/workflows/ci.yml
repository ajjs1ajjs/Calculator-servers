name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    # Ручний вимикач CI: pushes з '[skip actions]' у повідомленні коміта не стартують
    # (відкладений реліз 1 жовтня 2026 — економія лімітів Actions). На PR події
    # head_commit відсутній, тож contains() = false і job працює як завжди.
    if: ${{ !contains(github.event.head_commit.message, '[skip actions]') }}
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test with coverage
      run: dotnet test --no-restore --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory coverage

    - name: Install coverage tool
      run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.4.5

    - name: Generate coverage report
      run: reportgenerator -reports:coverage/**/coverage.cobertura.xml -targetdir:coverage/report -reporttypes:Html

    - name: Check for vulnerable packages
      run: dotnet list package --vulnerable || exit 1

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/report

    - name: Publish Windows (win-x64)
      run: dotnet publish ResourceCalculator/ResourceCalculator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-publish
        path: publish/win/ITE.ResourceCalculator.exe
