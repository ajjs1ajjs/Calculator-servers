name: Docs sync

# Легка перевірка синхрону документації з кодом: секунди на ubuntu, без збірки.
# Навмисно тільки PR + ручний запуск — пуші в main/master до 01.10.2026 не чіпаємо (ліміти Actions).
on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check docs sync
        shell: pwsh
        run: ./scripts/Update-Docs.ps1 -Check
